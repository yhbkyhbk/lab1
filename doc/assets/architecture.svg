<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <title>SVG 编辑器组件依赖图</title>
  <desc>CLI 调用 Application，并只读访问 Domain。Application 使用 Domain 和自身定义的 SvgStorage 端口。Infrastructure 实现端口并读写 Domain。main.ts 组装外层组件。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245f95"/></marker>
    <marker id="build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b46a15"/></marker>
    <marker id="realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 1 1 L 11 6 L 1 11 z" fill="white" stroke="#245f95"/></marker>
  </defs>
  <rect width="1080" height="720" fill="white"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#24384a">
    <text x="540" y="32" text-anchor="middle" font-size="23" font-weight="600">SVG 编辑器 · 组件依赖</text>
    <g fill="#f0f7fe" stroke="#6591b9" stroke-width="2">
      <rect x="50" y="60" width="380" height="110" rx="10"/>
      <rect x="50" y="290" width="380" height="135" rx="10"/>
      <rect x="650" y="290" width="380" height="135" rx="10"/>
    </g>
    <rect x="650" y="60" width="380" height="110" rx="10" fill="#fff6e8" stroke="#c9944d" stroke-width="2"/>
    <rect x="350" y="530" width="380" height="120" rx="10" fill="#edf7ef" stroke="#6a9b74" stroke-width="2"/>
    <text x="240" y="96" text-anchor="middle" font-size="22" font-weight="600">CLI</text>
    <text x="240" y="130" text-anchor="middle">REPL / Parser / Formatter</text>
    <text x="840" y="96" text-anchor="middle" font-size="22" font-weight="600">Composition Root</text>
    <text x="840" y="130" text-anchor="middle">main.ts</text>
    <text x="240" y="328" text-anchor="middle" font-size="22" font-weight="600">Application</text>
    <text x="240" y="362" text-anchor="middle">SvgEditor / Commands / History</text>
    <text x="240" y="399" text-anchor="middle" font-size="17">定义端口：SvgStorage</text>
    <text x="840" y="328" text-anchor="middle" font-size="22" font-weight="600">Infrastructure</text>
    <text x="840" y="362" text-anchor="middle">SVG Reader / Writer / Files</text>
    <text x="840" y="399" text-anchor="middle" font-size="17">实现 SvgStorage 端口</text>
    <text x="540" y="568" text-anchor="middle" font-size="22" font-weight="600">Domain</text>
    <text x="540" y="601" text-anchor="middle">Document / Shape / Group</text>
    <text x="540" y="632" text-anchor="middle" font-size="16">不依赖外层、文件系统或 XML 库</text>
    <g fill="none" stroke="#245f95" stroke-width="2" marker-end="url(#arrow)">
      <path d="M240 170 V290"/>
      <path d="M240 425 L430 530"/>
      <path d="M840 425 L650 530"/>
      <path d="M50 140 H25 V590 H350" stroke-dasharray="7 5"/>
    </g>
    <path d="M650 390 H430" fill="none" stroke="#245f95" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#realize)"/>
    <g fill="none" stroke="#b46a15" stroke-width="2" marker-end="url(#build)">
      <path d="M650 110 H430"/>
      <path d="M840 170 V290"/>
      <path d="M700 170 L430 290"/>
    </g>
    <g font-size="16">
      <text x="255" y="231">编辑用例</text>
      <text x="540" y="95" text-anchor="middle" fill="#955510">创建</text>
      <text x="855" y="231" fill="#955510">组装存储</text>
      <text x="520" y="212" fill="#955510">组装应用</text>
      <text x="540" y="376" text-anchor="middle">实现端口</text>
      <text x="245" y="485">领域行为</text>
      <text x="783" y="485">构造 / 序列化</text>
      <text x="70" y="578">只读 Visitor</text>
      <text x="540" y="696" text-anchor="middle" fill="#596b79">实线：调用或依赖　虚线：只读协议 / 端口实现　橙色：入口组装</text>
    </g>
  </g>
</svg>
